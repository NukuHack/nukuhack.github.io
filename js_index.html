<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stupid Webpage</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/darkreader@4.9.34/darkreader.min.js"></script>
    <!-- Core deps for the Document viewer that are small enough to load up front -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-csharp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    

  <script>
  /// this for 404's custom redirect
  if (sessionStorage.redirect) {
    history.replaceState(null, '', sessionStorage.redirect);
    sessionStorage.removeItem('redirect');
  }
  </script>

  <script type="module">
  // Boot WASM (needed so the module is genuinely loaded/used)
  window.MicroReact = await import('./public/wasm/micro-react/pkg/micro_react.js')
    .then(async (m) => { await m.default(); return m; });

  // html is a wrapper: tagged templates call (strings, ...values), the
  // wasm export needs (strings, valuesArray) — no way to avoid this one.
  window.html = (txt, ...val) => MicroReact.htmlTemplate(txt, val);

  // ─── lazy() — React-style lazy loading on top of the existing Suspense ───
  // A component "suspends" by throwing a pending promise (a thenable); Suspense
  // catches that (same path as a thrown error) and retries once it settles.
  // This needs no WASM changes — it's the same trick memo()/forwardRef() use.
  window.lazy = function lazy(loader) {
    let status = 'pending';   // 'pending' | 'success' | 'error'
    let payload;              // resolved component, or the caught error
    let promise;               // memoized so we only call loader() once

    return function Lazy(props) {
      if (status === 'success') return createElement(payload, props);
      if (status === 'error') throw payload;

      if (!promise) {
        promise = Promise.resolve(loader()).then(
          (mod) => { status = 'success'; payload = (mod && mod.default) ? mod.default : mod; },
          (err) => { status = 'error'; payload = err; },
        );
      }
      throw promise; // Suspense sees this is a thenable -> renders fallback, retries on settle
    };
  };

  // react-router-dom's BrowserRouter just supplies history context to Routes —
  // this Router already reads window.location/history directly, so BrowserRouter
  // only needs to exist and render its children.
  window.BrowserRouter = function BrowserRouter(props) {
    return props.children;
  };

  // make everything Global
  Object.assign(window, MicroReact, MicroReact.createExtras());


  // ─── JSX LOADER DEMO ───
  const [{ default: App }] = await Promise.all([loadJsx("./src/App.jsx")]);

  window.__root = await render(html`<${App} />`, document.getElementById('root'));
  </script>


  </body>
</html>
