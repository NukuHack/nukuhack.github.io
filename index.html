<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/public/assets/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stupid Webpage</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" crossorigin="anonymous" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" crossorigin="anonymous" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/darkreader@4.9.34/darkreader.min.js"></script>
    <!-- Core deps for the Document viewer that are small enough to load up front -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-csharp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

  <script>
  /// this for 404's custom redirect
  if (sessionStorage.redirect) {
    history.replaceState(null, '', sessionStorage.redirect);
    sessionStorage.removeItem('redirect');
  }
  </script>

  <script type="module">
  import { getWasm } from './src/lib/loader.js';
  // Boot WASM
  window.MicroReact = await getWasm('React')
    .then(async (m) => { await m.default(); return m; });

  // Everything below this line is the only project-specific bit left:
  // src/**/*.jsx writes root-relative asset paths the way Vite serves
  // `public/` at the site root. A plain static server doesn't do that
  // rewrite, so tell micro-react which are the top-level public/ folders
  MicroReact.setPublicPrefixes(["assets", "resources", "wasm"]);

  // html is a wrapper: tagged templates call (strings, ...values), the
  // wasm export needs (strings, valuesArray) — no way to avoid this one.
  window.html = (txt, ...val) => MicroReact.htmlTemplate(txt, val);

  // make everything Global from wasm
  Object.assign(window, MicroReact, MicroReact.createExtras());

  // ─── JSX LOADER ───
  const { default: App } = await loadJsx("./src/App.jsx");

  window.__root = await render(html`<${App} />`, document.getElementById('root'));
  </script>


  </body>
</html>
